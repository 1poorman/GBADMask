_BASE_: "Base-BlendMask-BiFPN.yaml"
MODEL:
  META_ARCHITECTURE: "BlendMask"
  #WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  BACKBONE:
    NAME: "build_fcos_csp_vig_bifpn_backbone"   #
  RESNETS:
    DEPTH: 50
  BiFPN:
    NUM_REPEATS: 6
    NORM: "GN"
  BASIS_MODULE:
    NUM_CLASSES: 17
  FCOS:
    NUM_CLASSES: 17
DATASETS:
  TRAIN: ("Strawberry_train",)   #
  TEST: ("Strawberry_val",)       #
SOLVER: 
  STEPS: (60000,80000)
  MAX_ITER: 90000
  IMS_PER_BATCH: 6
  BASE_LR: 0.001  # Note that RetinaNet uses a different default learning rate
  CHECKPOINT_PERIOD: 30000
TEST:
  EVAL_PERIOD: 5000
OUTPUT_DIR: "output/blendmask+/Strawberry"
