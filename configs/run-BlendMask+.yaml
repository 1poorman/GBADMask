# GBADMask 主配置：BlendMask + MobileViG(ViG 图卷积骨干) + BiFPN
#
# 相对官方 BlendMask 的两处改动：
#   1. 骨干由 ResNet 换成 adet/modeling/backbone/cspvig.py 的 MobileViG
#      （Stem + 3 段 local InvertedResidual + 1 段 global Grapher/FFN，CSP 式分半）
#   2. basis 模块可用 adet/modeling/blendmask/basis_module2.py 的改进版 ProtoNet
#      （低层特征 + GCNet 全局上下文融合 + Focal-Dice-CE 混合损失）
#      ——注意：本配置用的是 META_ARCHITECTURE="BlendMask"，走的是**官方** basis 模块，
#        改进版并未生效。想启用改进版请改用 META_ARCHITECTURE="BlendMask2"，
#        或直接参考 configs/run-BlendMask2-vig.yaml。
#
# 数据集：DATASETS.TRAIN 只是"注册名"，磁盘路径由环境变量 GBADMASK_DATA_ROOT 指定，
#   默认 <项目根>/datasets/<数据集名>。详见 README 第 6 节。
_BASE_: "Base-BlendMask-BiFPN.yaml"
MODEL:
  META_ARCHITECTURE: "BlendMask"
  # MobileViG 的 ImageNet 预训练权重（需自行下载并转换 key 后启用）
  # WEIGHTS: "pretrain/MobileViG/MobileViG_M_80_7.pth.tar"
  BACKBONE:
    NAME: "build_fcos_cspvig_bifpn_backbone"   # MobileViG + BiFPN
  BiFPN:
    IN_FEATURES: ["res3", "res4", "res5"]      # ViG 输出 res2~res5 = 42/84/224/400 通道
    NUM_REPEATS: 6
    NORM: "GN"
  BASIS_MODULE:
    # base 里是 True；自定义数据集没有 thing_train2017/*.npz，必须显式关掉
    LOSS_ON: False
    NUM_CLASSES: 17     # 必须 = 数据集 categories 数量（辅助语义头，代码内部会 +1）
  FCOS:
    NUM_CLASSES: 17     # 必须 = 数据集 categories 数量（前景类，不含背景）
DATASETS:
  TRAIN: ("Strawberry_train",)   # 需在 tools/train_bl+.py 的 PREDEFINED_SPLITS_DATASET 中注册
  TEST: ("Strawberry_val",)
SOLVER:
  STEPS: (60000,80000)
  MAX_ITER: 90000
  IMS_PER_BATCH: 6     # 原服务器调参值；换卡后请按 实际总batch/16 * 0.01 重算 BASE_LR
  BASE_LR: 0.001       # Note that RetinaNet uses a different default learning rate
  CHECKPOINT_PERIOD: 30000
TEST:
  EVAL_PERIOD: 5000
OUTPUT_DIR: "output/blendmask-plus/Strawberry"
