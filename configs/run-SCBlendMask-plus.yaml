# SCBlendMask+：BlendMask + Lcspvig（MobileViG + LSK 大核选择注意力）+ BiFPN
#
# 与 run-BlendMask2-vig.yaml 构成骨干消融对 —— 两者唯一区别是 backbone：
#   run-BlendMask2-vig.yaml → MobileViG（cspvig）
#   本文件               → Lcspvig（MobileViG + LSK 大核选择注意力）
#
# LSK 说明：Lcspvig 的 4 个 stage transition 层由 Conv-BN-Hardswish 换成
#   Conv → LSKblock → BN → Hardswish，使每个尺度输出前先做一次空间选择性大核加权。
#   用 MODEL.VIG.USE_LSK: False 可退回无 LSK 版本，用于消融验证 LSK 本身的收益。
#   参数量：cspvig 4.14M → Lcspvig 4.53M（+0.39M）。
#
# 数据集：DATASETS.TRAIN 只是"注册名"，磁盘路径由环境变量 GBADMASK_DATA_ROOT 指定，
#   默认 <项目根>/datasets/<数据集名>。详见 README 第 6 节。
_BASE_: "Base-BlendMask-BiFPN.yaml"
MODEL:
  # basis 模块改由 MODEL.BASIS_MODULE.NAME 选择：
  #   "ProtoNet"   = 官方实现
  #   "ProtoNetV2" = 改进版（低层特征 + 注意力融合 + Focal-Dice-CE）
  # 这里沿用旧写法 BlendMask2（等价于 BlendMask），仅为向后兼容。
  META_ARCHITECTURE: "BlendMask2"
  # WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"   # 仅 ResNet 适用，ViG 无效
  BACKBONE:
    NAME: "build_fcos_Lcspvig_bifpn_backbone"   # Lcspvig + BiFPN
  VIG:
    USE_LSK: True          # 设为 False 则退化为普通 cspvig，用于消融
  BiFPN:
    IN_FEATURES: ["res3", "res4", "res5"]
    NUM_REPEATS: 6
    NORM: "GN"
  BASIS_MODULE:
    NAME: "ProtoNetV2"     # 改进版 basis 模块（见 adet/modeling/blendmask/basis_module2.py）
    ATTN: "gc"             # none / gc / cbam / ca
    # base 里是 True；自定义数据集没有 thing_train2017/*.npz，必须显式关掉
    LOSS_ON: False
    NUM_CLASSES: 17     # 必须 = 数据集 categories 数量（辅助语义头，代码内部会 +1）
    LOSS_WEIGHT: 0.3    # 语义辅助损失权重；开启 LOSS_ON 时才用到
  FCOS:
    NUM_CLASSES: 17     # 必须 = 数据集 categories 数量（前景类，不含背景）
DATASETS:
  TRAIN: ("Plantv2_train",)   # 需在 tools/train_scbl_plus.py 的 PREDEFINED_SPLITS_DATASET 中注册
  TEST: ("Plantv2_val",)
SOLVER:
  STEPS: (60000,80000)
  MAX_ITER: 90000
  IMS_PER_BATCH: 6     # 原服务器调参值；换卡后请按 实际总batch/16 * 0.01 重算 BASE_LR
  BASE_LR: 0.001       # Note that RetinaNet uses a different default learning rate
  CHECKPOINT_PERIOD: 30000
TEST:
  EVAL_PERIOD: 5000
OUTPUT_DIR: "output/SCblendmask-plus/Plantv2"
