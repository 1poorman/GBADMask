# BlendMask（官方 basis 模块）+ MobileViG(ViG 图卷积骨干) + BiFPN
#
# 与 run-BlendMask2-vig.yaml 构成消融对 —— 两者唯一区别是 META_ARCHITECTURE：
#   本文件                  → "BlendMask"   官方 ProtoNet + 官方 CrossEntropy 语义损失
#   run-BlendMask2-vig.yaml → "BlendMask2"  改进 ProtoNet（GC 全局上下文 + Focal-Dice-CE）
# 用这一对可以单独量化 basis 模块改动的收益。
#
# 若想改用「MobileViG + 标准 FPN」而非 BiFPN，把 BACKBONE.NAME 换成
#   "build_cspvigm_fpn_backbone"
# 并同时覆盖（FPN 的 top_block 是 LastLevelMaxPool，只产生 p6，没有 p7）：
#   MODEL.FPN.IN_FEATURES: ["res2", "res3", "res4", "res5"]
#   MODEL.RESNETS.OUT_FEATURES: ["res2", "res3", "res4", "res5"]
#   MODEL.FCOS.IN_FEATURES: ["p3", "p4", "p5", "p6"]
#
# 数据集：DATASETS.TRAIN 只是"注册名"，磁盘路径由环境变量 GBADMASK_DATA_ROOT 指定，
#   默认 <项目根>/datasets/<数据集名>。详见 README 第 6 节。
_BASE_: "Base-BlendMask-BiFPN.yaml"
MODEL:
  META_ARCHITECTURE: "BlendMask"   # 官方 basis 模块（基线）
  # MobileViG 的 ImageNet 预训练权重（需自行下载并转换 key 后启用）
  # WEIGHTS: "pretrain/MobileViG/MobileViG_M_80_7.pth.tar"
  BACKBONE:
    NAME: "build_fcos_cspvig_bifpn_backbone"   # MobileViG + BiFPN
  BiFPN:
    IN_FEATURES: ["res3", "res4", "res5"]
    NUM_REPEATS: 6
    NORM: "GN"
  BASIS_MODULE:
    # base 里是 True；自定义数据集没有 thing_train2017/*.npz，必须显式关掉
    LOSS_ON: False
    NUM_CLASSES: 17     # 必须 = 数据集 categories 数量（辅助语义头，代码内部会 +1）
  FCOS:
    NUM_CLASSES: 17     # 必须 = 数据集 categories 数量（前景类，不含背景）
DATASETS:
  TRAIN: ("Plantv2_train",)   # 需在 tools/train_bl+.py 的 PREDEFINED_SPLITS_DATASET 中注册
  TEST: ("Plantv2_val",)
SOLVER:
  STEPS: (60000,80000)
  MAX_ITER: 90000
  IMS_PER_BATCH: 6     # 原服务器调参值；换卡后请按 实际总batch/16 * 0.01 重算 BASE_LR
  BASE_LR: 0.001       # Note that RetinaNet uses a different default learning rate
  CHECKPOINT_PERIOD: 30000
TEST:
  EVAL_PERIOD: 5000
OUTPUT_DIR: "output/blendmask-vig/Plantv2"
