# 官方 BlendMask 基线：ResNet + BiFPN（COCO）
# 本项目所有 run-*.yaml 的公共父配置。ViG 系列骨干只是替换了 BiFPN 的 bottom_up，
# 因此 BiFPN / FCOS / BASIS_MODULE 的字段全部可以沿用官方语义。
#
# 注意：BASIS_MODULE.LOSS_ON: True 需要数据集额外提供 thing_train2017/*.npz
# basis 语义监督（见 adet/data/dataset_mapper.py:195-214）。
# 自定义数据集（草莓 / 植株）请在子配置里显式设为 False，否则 dataloader 会直接报
# FileNotFoundError。
MODEL:
  META_ARCHITECTURE: "BlendMask"   # 注册名只有 "BlendMask"（"BlendMask1" 为不可用实验代码）
  MASK_ON: True

  BACKBONE:
    NAME: "build_fcos_resnet_bifpn_backbone"
  RESNETS:
    OUT_FEATURES: ["res3", "res4", "res5"]
  BiFPN:
    IN_FEATURES: [ "res3", "res4", "res5", ]   # 须是骨干 _out_features 的子集
    OUT_CHANNELS: 160               # 显存吃紧时可降到 96 / 128
    NUM_REPEATS: 6                  # 可降到 3~4 换取吞吐
    NORM: "GN"
  PROPOSAL_GENERATOR:
    NAME: "FCOS"
  BASIS_MODULE:
    LOSS_ON: True                  # 仅 COCO（已有 thing_train2017）可开
  PANOPTIC_FPN:
    COMBINE:
      ENABLED: False
  FCOS:
    THRESH_WITH_CTR: True
    USE_SCALE: False
DATASETS:
  TRAIN: ("coco_2017_train",)      # 需 datasets/coco 存在并被注册
  TEST: ("coco_2017_val",)
SOLVER:
  IMS_PER_BATCH: 16                # 8 卡配置，单卡请按比例下调并同步缩放 BASE_LR
  BASE_LR: 0.01  # Note that RetinaNet uses a different default learning rate
  STEPS: (60000, 80000)            # COCO 3x schedule
  MAX_ITER: 90000
INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
VERSION: 2
